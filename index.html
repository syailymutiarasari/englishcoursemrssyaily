<!DOCTYPE html>
<html>
<head>
  <title>English Course Mrs. Syaily</title>
  <style>
    body { font-family: Arial; padding: 20px; max-width: 900px; margin: auto; }
    h1 { text-align: center; }

    .box {
      border: 1px solid #ddd;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 10px;
    }

    input, select, button {
      padding: 8px;
      margin: 5px 0;
      width: 100%;
    }

    button {
      background: #2d6cdf;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover { background: #1b4fb3; }

    .student {
      border: 1px solid #ddd;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
    }

    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
  </style>
</head>

<body>

<h1>English Course Mrs. Syaily</h1>

<!-- FORM -->
<div class="box">
  <h3>Add Student</h3>

  <input id="name" placeholder="Student name">
  <input id="material" placeholder="Material">

  <div class="row">
    <select id="level">
      <option>Beginner</option>
      <option>Intermediate</option>
      <option>Advanced</option>
    </select>

    <select id="status">
      <option>In progress</option>
      <option>Not yet mastered</option>
      <option>Mastered</option>
    </select>
  </div>

  <button onclick="addStudent()">Add Student</button>
</div>

<!-- SEARCH & FILTER -->
<div class="box">
  <h3>Search & Filter</h3>

  <input id="search" onkeyup="render()" placeholder="Search student name">

  <select id="filter" onchange="render()">
    <option value="All">All Levels</option>
    <option value="Beginner">Beginner</option>
    <option value="Intermediate">Intermediate</option>
    <option value="Advanced">Advanced</option>
  </select>
</div>

<!-- LIST -->
<div class="box">
  <h3>Students</h3>
  <div id="list"></div>
</div>

<script>
let students = JSON.parse(localStorage.getItem("students")) || [];

function addStudent() {
  let name = document.getElementById("name").value;
  let material = document.getElementById("material").value;
  let level = document.getElementById("level").value;
  let status = document.getElementById("status").value;

  if (!name || !material) return alert("Isi data lengkap!");

  students.push({ name, material, level, status });

  localStorage.setItem("students", JSON.stringify(students));

  document.getElementById("name").value = "";
  document.getElementById("material").value = "";

  render();
}

function render() {
  let list = document.getElementById("list");
  let search = document.getElementById("search").value.toLowerCase();
  let filter = document.getElementById("filter").value;

  list.innerHTML = "";

  students
    .filter(s => s.name.toLowerCase().includes(search))
    .filter(s => filter === "All" || s.level === filter)
    .forEach(s => {
      list.innerHTML += `
        <div class="student">
          <b>${s.name}</b><br>
          Level: ${s.level}<br>
          Material: ${s.material}<br>
          Status: ${s.status}
        </div>
      `;
    });
}

render();
</script>

</body>
</html>
